services:
    # The Application
    newkur-api:
        container_name: newkur-api
        restart: "unless-stopped"
        build:
            context: ./
            dockerfile: .docker/php/Dockerfile
        working_dir: /var/www
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            DB_PORT: ${DB_PORT}
            DB_HOST: ${DB_HOST}
            DB_CONNECTION: ${DB_CONNECTION}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_DATABASE: ${DB_DATABASE}
            APP_ENV: ${APP_ENV}
            APP_DEBUG: ${APP_DEBUG}
            APP_NAME: ${APP_NAME}
        volumes:
            - ".:/var/www"
        depends_on:
#            - pgsql
            - newkur-redis
            - newkur-npm
            # - meilisearch
            # - soketi

    newkur-composer:
        container_name: newkur-composer
        restart: "no"
        image: prooph/composer:8.2
        working_dir: /var/www
        command: install --no-ansi --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader
        volumes:
            - .:/var/www

    newkur-npm:
        container_name: newkur-npm
        image: node:16.19.1-alpine3.17
        working_dir: /var/www
        command: yarn install
        depends_on:
            newkur-composer:
                condition: service_completed_successfully
        volumes:
            - .:/var/www

    # The Nginx Server
    newkur-nginx:
        container_name: newkur-nginx
        restart: "unless-stopped"
        build:
            context: ./
            dockerfile: .docker/nginx/Dockerfile
        working_dir: /var/www
        depends_on:
            - newkur-api
        networks:
            - shared-network
        volumes_from:
            - newkur-api
        ports:
            - 410:80

