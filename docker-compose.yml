    newkur-redis:
        container_name: newkur-redis
        image: "redis:alpine"
        #ports:
        #    - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - shared-network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
