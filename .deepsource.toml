version = 1

test_patterns = [
  "tests/**",
  "Modules/*/Tests/**"
]

exclude_patterns = [
  "Modules/*/Database/**",
  "database/**",
  "stubs/**",
  "storage/**",
  "public/**",
  "_ide_helper.php",
  ".phpstorm.meta.php",
  "deploy.php"
]

[[analyzers]]
name = "php"

  [analyzers.meta]
  bootstrap_files = ["vendor/autoload.php"]
