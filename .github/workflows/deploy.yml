name: Deployment

on:
  pull_request:
    types: [closed]
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: csv, mbstring, bcmath, xdebug
          coverage: xdebug
      - uses: actions/checkout@v3
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install Dependencies
        run: composer install -q --ignore-platform-reqs --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Static analysis via PHPStan
        run: vendor/bin/phpstan analyze --memory-limit 4G
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: vendor/bin/pest --parallel
      # - name: Report test coverage to DeepSource
      #   uses: deepsourcelabs/test-coverage-action@master
      #   with:
      #     key: php
      #     coverage-file: coverage.xml
      #     dsn: ${{ secrets.DEEPSOURCE_DSN }}

  deploy-staging:
    name: Deploy Project to Staging Server
    runs-on: ubuntu-latest
    # needs: unit-tests
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: csv, mbstring, bcmath

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup SSH for deployer staging
        uses: shimataro/ssh-key-action@v2.3.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS_STAGING }}
          if_key_exists: replace

      - name: Deploy to Staging
        run: |
          STAGING_HOST=${{ secrets.STAGING_HOST }} \
          STAGING_PORT=${{ secrets.STAGING_PORT }} \
          STAGING_USER=${{ secrets.STAGING_USER }} \
          STAGING_BRANCH=${{ secrets.STAGING_BRANCH }} \
          STAGING_DEPLOY_PATH=${{ secrets.STAGING_DEPLOY_PATH }} \
          php vendor/bin/dep deploy staging --branch="${{ secrets.STAGING_BRANCH }}" -vv

  deploy-production:
    name: Deploy Project to Production Server
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: csv, mbstring, bcmath

      - name: Composer install
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup SSH for deployer
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Setup Deployer
        uses: atymic/deployer-php-action@master
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Deploy to Production
        run: php vendor/bin/dep deploy productin --branch="main" -vv
