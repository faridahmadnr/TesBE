server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    # Routing untuk aplikasi Laravel di /api
    location /api {
        try_files $uri $uri/ /index.php?$args;  # Cek file, kalau tidak ada lanjutkan ke index.php
    }

    # Routing untuk semua permintaan ke file PHP
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass newkur-api:9000;  # Container PHP-FPM, pastikan nama container sesuai dengan yang ada di Docker Compose
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Routing untuk frontend
    location / {
        proxy_pass http://newkur-frontend:80; # sesuaikan port jika berbeda
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Sign $http_x_sign;  # Pastikan header diteruskan
        proxy_set_header X-Sign-Timestamp $http_x_sign_timestamp; 
    }
}