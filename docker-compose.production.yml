services:
  # The Application
  newkur-api:
    container_name: newkur-api
    restart: "unless-stopped"
    build:
      context: ./
      dockerfile: .docker/php/Dockerfile
    working_dir: /var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-network
    environment:
      DB_PORT: ${DB_PORT}
      DB_HOST: ${DB_HOST}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_NAME: ${APP_NAME}
    volumes:
      - ".:/var/www"
      - vendor:/var/www/vendor
      - bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      - newkur-redis

  newkur-frontend:
    image: newkur-frontend #sesuaikan dengan yang ada
    container_name: newkur-frontend
    depends_on:
      - newkur-api
    networks:
      - shared-network
    ports:
      - "8756:80"

  # The Nginx Server
  newkur-nginx:
    container_name: newkur-nginx
    restart: "unless-stopped"
    image: nginx:alpine
    working_dir: /var/www
    volumes:
      - ./.docker/nginx/nginx-with-fe.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - newkur-api
      - newkur-frontend
    networks:
      - shared-network
    volumes_from:
      - newkur-api
    ports:
      - 410:80

  newkur-redis:
    container_name: newkur-redis
    image: "redis:alpine"
    volumes:
      - "kur-redis:/data"
    networks:
      - shared-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

networks:
  shared-network:
    external: false
volumes:
  kur-redis:
    driver: local
  vendor:
  bootstrap_cache:
