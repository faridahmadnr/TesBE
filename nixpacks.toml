[phps]
extensions = [
    "zip", "pdo", "pdo_pgsql", "pgsql", 
    "mbstring", "tokenizer", "xml", "ctype",
    "openssl", "fileinfo", "gd", "curl",
    "exif", "bcmath", "sodium", "redis"
]
version = "8.2"

[build]
script = """
composer install --no-dev --no-interaction --optimize-autoloader
php artisan key:generate --force
php artisan storage:link
"""

[start]
cmd = "php artisan migrate --force && vendor/bin/heroku-php-apache2 public/"

[deploy]
startCommand = "php artisan config:cache && php artisan route:cache && php artisan view:cache"